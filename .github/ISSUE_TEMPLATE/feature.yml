name: Feature request
description: 建议一个功能或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - macOS（实验性，可能排期较慢）
        - 两端
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先描述场景，不急着给方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以是交互、菜单、配置或视觉上的想法。

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
